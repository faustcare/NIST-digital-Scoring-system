<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NIST 數位評分表</title>
<style>
:root{
  --bg:#0d1017; --bg2:#131826; --panel:#1a2030; --panel2:#222a3d; --line:#283044;
  --ink:#e9ecf3; --muted:#8b93a7; --faint:#5c6478;
  --paper:#f4f1e8; --paper-ink:#1b1e26; --paper-mut:#6f7688;
  --green:#18a879; --green-d:#0e7a57; --green-soft:rgba(24,168,121,.14);
  --blue:#4d82ff; --blue-d:#3564cf; --blue-soft:rgba(77,130,255,.14);
  --amber:#e2a53c; --amber-soft:rgba(226,165,60,.14);
  --red:#e05d52; --red-soft:rgba(224,93,82,.14);
  --mono:ui-monospace,"SF Mono","Cascadia Mono","IBM Plex Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue","Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{height:100%}
body{
  background:radial-gradient(1200px 600px at 50% -8%,#182036 0%,var(--bg) 55%) fixed, var(--bg);
  color:var(--ink); font-family:var(--sans); min-height:100%; -webkit-font-smoothing:antialiased;
}
#app{max-width:640px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
/* ---------- top bar ---------- */
#topbar{
  position:sticky;top:0;z-index:30;background:rgba(13,16,23,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);padding:10px 14px 9px;
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
#topbar .brand{display:flex;align-items:center;gap:9px;min-width:0}
#topbar .ringlogo{width:26px;height:26px;flex:0 0 26px;border-radius:50%;border:2.5px solid var(--green);position:relative}
#topbar .ringlogo::before{content:"";position:absolute;inset:5px;border-radius:50%;border:1.5px solid var(--blue)}
#topbar .ttl{font-size:13px;font-weight:600;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#topbar .sub{font-size:10px;color:var(--faint);letter-spacing:.14em;text-transform:uppercase}
#topbar .spacer{flex:1}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
#timerBox{text-align:right;line-height:1.15}
#timerBox .tbig{font-size:19px;font-weight:700;letter-spacing:.03em}
#timerBox .tlbl{font-size:9px;color:var(--faint);letter-spacing:.16em;text-transform:uppercase}
#scoreBox{text-align:right;line-height:1.15}
#scoreBox .sbig{font-size:17px;font-weight:700}
#scoreBox .slbl{font-size:9px;color:var(--faint);letter-spacing:.16em;text-transform:uppercase}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px;vertical-align:1px}
.dot.saved{background:var(--green);box-shadow:0 0 6px var(--green)}
.dot.dirty{background:var(--amber);box-shadow:0 0 6px var(--amber)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:2px 8px}
.chip.hot{color:var(--amber);border-color:var(--amber);}
.chip.ok{color:var(--green);border-color:var(--green-d);}
/* ---------- main ---------- */
main#view{flex:1;padding:16px 14px 150px}
h1.viewttl{font-size:20px;font-weight:800;letter-spacing:.01em}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--blue);margin-bottom:4px}
.lede{color:var(--muted);font-size:13px;line-height:1.6;margin-top:6px}
/* hero stamp */
.bucketstamp{display:flex;flex-direction:column;align-items:center;margin:18px auto 6px;gap:10px}
.stampwrap{position:relative;width:110px;height:110px}
.stampring{position:absolute;inset:0;border-radius:50%;border:3px solid var(--green)}
.stampring::before{content:"";position:absolute;inset:14px;border-radius:50%;border:2px dashed var(--blue);opacity:.9}
.stampcore{position:absolute;inset:30px;border-radius:50%;border:2.5px solid var(--amber);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:17px;color:var(--amber)}
.stamplbl{font-family:var(--mono);font-size:11px;letter-spacing:.34em;color:var(--faint)}
.stattrio{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 6px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:center}
.stat b{display:block;font-family:var(--mono);font-size:19px;font-weight:700;letter-spacing:.02em}
.stat span{font-size:10px;color:var(--muted);letter-spacing:.06em}
/* cards & buttons */
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.card + .card{margin-top:10px}
.card h3{font-size:14px;font-weight:700;display:flex;align-items:center;gap:8px}
.card h3 .lanechip{font-family:var(--mono);font-size:9px;letter-spacing:.1em;padding:2px 7px;border-radius:5px;border:1px solid var(--line);color:var(--muted)}
.card .meta{font-size:11px;color:var(--muted);margin-top:7px;line-height:1.55}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:10px;
  font-family:var(--sans);font-size:14px;font-weight:600;padding:13px 16px;cursor:pointer;
  -webkit-tap-highlight-color:transparent;transition:transform .06s ease,background .12s ease;text-decoration:none;user-select:none;
}
.btn:active{transform:scale(.97)}
.btn:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.btn.primary{background:var(--green);border-color:var(--green);color:#06110c;font-weight:700}
.btn.primary:active{background:var(--green-d)}
.btn.ghost{background:transparent}
.btn.block{width:100%}
.btn.small{padding:8px 12px;font-size:12px;border-radius:8px}
.btn.redline{background:transparent;border-color:var(--red);color:var(--red)}
.btn.amberline{background:transparent;border-color:var(--amber);color:var(--amber)}
.btnrow{display:flex;gap:8px;margin-top:12px}
.btnrow .btn{flex:1}
.formlib{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.formrow{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 13px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.formrow:hover{border-color:var(--green-d)}
.formrow .fname{font-size:14px;font-weight:600}
.formrow .fdesc{font-size:11px;color:var(--muted);margin-top:2px}
.formrow .fold{font-size:9px}
.fold{font-family:var(--mono);letter-spacing:.08em;background:var(--bg2);border:1px solid var(--line);color:var(--muted);padding:2px 7px;border-radius:5px;font-size:10px;white-space:nowrap}
.sechead{margin:22px 0 8px;font-size:13px;font-weight:700;letter-spacing:.04em;display:flex;align-items:center;gap:8px}
.sechead::after{content:"";flex:1;height:1px;background:var(--line)}
.sechead small{font-weight:500;color:var(--muted);font-size:10px;letter-spacing:0}
/* forms (trial info) */
.flabel{display:block;font-size:11px;color:var(--muted);letter-spacing:.05em;margin:12px 0 5px}
.flabel .req{color:var(--amber)}
.finput,.fselect,.ftextarea{
  width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:9px;color:var(--ink);
  font-family:var(--sans);font-size:15px;padding:11px 12px;-webkit-appearance:none;appearance:none;
}
.finput:focus,.fselect:focus,.ftextarea:focus{outline:none;border-color:var(--blue)}
.fselect{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 17px) 55%,calc(100% - 12px) 55%;background-size:5px 5px;background-repeat:no-repeat}
.frow2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.finput{font-family:var(--mono);font-size:14px;letter-spacing:.02em}
.finput[type=date],.finput[type=time]{color-scheme:dark}
input[type=color]{width:44px;height:40px;padding:2px;border-radius:8px}
textarea.ftextarea{resize:vertical;min-height:64px;font-family:var(--sans)}
.cond{background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:11px 12px;margin-bottom:8px}
.cond .ct{font-size:11px;color:var(--muted);letter-spacing:.06em}
.cond .cv{font-size:14px;font-weight:600;margin-top:3px;font-family:var(--mono)}
/* ---------- scoring ---------- */
.scrwrap{display:flex;flex-direction:column;gap:14px}
.scritem{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px}
.scritem .st{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.scritem .st .nm{font-size:13px;font-weight:700}
.scritem .st .pn{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.04em;margin-left:auto}
.legend{display:flex;gap:12px;margin-top:8px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--muted)}
.lcell{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--line);display:inline-block;position:relative}
.lcell.g{background:var(--green)}.lcell.h{background:linear-gradient(to bottom,var(--amber) 50%,transparent 50%);border-color:var(--amber)}.lcell.x{background:transparent;border-color:var(--red)}.lcell.x::before{content:"✕";position:absolute;left:-1px;top:-4px;color:var(--red);font-size:11px}.lcell.b{background:var(--blue)}
/* bucket grid */
.bgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:7px}
.bgrid .rowlab{grid-column:1;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:11px;color:var(--muted)}
.cell{
  position:relative;aspect-ratio:1;border-radius:50%;border:2px dashed var(--line);background:transparent;color:var(--muted);
  display:flex;align-items:center;justify-content:center;cursor:pointer;font-family:var(--mono);font-size:12px;font-weight:600;
  -webkit-tap-highlight-color:transparent;transition:transform .05s ease;user-select:none;
}
.cell:active{transform:scale(.92)}
.cell.lp{transform:scale(.82);border-color:var(--amber);box-shadow:0 0 0 3px var(--amber-soft)}
.cell.linked{animation:linkflash .5s ease}
@keyframes linkflash{0%{box-shadow:0 0 0 0 var(--blue)}40%{box-shadow:0 0 0 6px var(--blue-soft)}100%{box-shadow:0 0 0 0 transparent}}
.cell:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.cell .pts{position:absolute;right:-3px;bottom:-3px;font-size:8px;font-weight:700;font-family:var(--mono);background:var(--panel2);border:1px solid var(--line);border-radius:99px;padding:0 4px;line-height:14px}
.cell.pass{border:2.5px solid var(--green);background:var(--green-soft);color:var(--green)}
.cell.pass::after{content:"✓";position:absolute;font-size:16px;font-weight:800;color:var(--green)}
.cell.partial{border:2.5px solid var(--amber);background:var(--amber-soft);color:var(--amber)}
.cell.partial::after{content:"½";position:absolute;font-size:13px;font-weight:700;color:var(--amber)}
.cell.miss{border:2.5px solid var(--red);background:var(--red-soft);color:var(--red)}
.cell.miss::after{content:"✕";position:absolute;font-size:15px;font-weight:800;color:var(--red)}
.cell.ok{border:2.5px solid var(--blue);background:var(--blue-soft);color:var(--blue)}
.cell.ok::after{content:"✓";position:absolute;font-size:16px;font-weight:800;color:var(--blue)}
.cell.no{border:2.5px solid var(--red);background:var(--red-soft);color:var(--red)}
.cell.no::after{content:"✕";position:absolute;font-size:15px;font-weight:800;color:var(--red)}
.cell .code{position:relative;z-index:1;font-size:11px}
.scrtot{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:2px}
.scrtot .t{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:9px;text-align:center}
.scrtot .t b{display:block;font-family:var(--mono);font-size:15px}
.scrtot .t span{font-size:9px;color:var(--muted);letter-spacing:.05em}
.scrtot .t.hl{border-color:var(--green-d);background:var(--green-soft)}
.scrtot .t.hl b{color:var(--green)}
/* ---------- bottom bar ---------- */
#bottombar{
  position:fixed;bottom:0;left:0;right:0;z-index:30;background:rgba(13,16,23,.94);backdrop-filter:blur(8px);
  border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));
}
#bottombar .inner{max-width:640px;margin:0 auto;display:flex;gap:8px}
#bottombar .inner .btn{flex:1}
.toast{
  position:fixed;bottom:76px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--line);
  color:var(--ink);font-size:12px;padding:8px 14px;border-radius:99px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.4);
  opacity:0;pointer-events:none;transition:opacity .18s ease;font-family:var(--mono);
}
.toast.show{opacity:1}
/* ---------- result / paper sheet ---------- */
.sheet{background:var(--paper);color:var(--paper-ink);border-radius:14px;padding:18px 16px;box-shadow:0 14px 40px rgba(0,0,0,.4);overflow:hidden}
.sheet .shead{border-bottom:2px solid var(--paper-ink);padding-bottom:10px;margin-bottom:12px}
.sheet .shead .t{font-size:17px;font-weight:800;letter-spacing:.02em}
.sheet .shead .s{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--paper-mut);margin-top:3px}
.sheet h4{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--paper-mut);margin:16px 0 8px;border-bottom:1px solid rgba(27,30,38,.18);padding-bottom:4px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:12px}
.kv .k{color:var(--paper-mut)}
.kv .v{font-weight:600;font-family:var(--mono);font-size:12px;text-align:right}
.kv .v.s{text-align:left;font-family:var(--sans)}
.bigtot{display:flex;gap:8px;margin-top:6px}
.bigtot>div{flex:1;border:1.5px solid var(--paper-ink);border-radius:10px;padding:10px;text-align:center}
.bigtot b{display:block;font-family:var(--mono);font-size:26px;font-weight:800}
.bigtot span{font-size:10px;letter-spacing:.08em;color:var(--paper-mut)}
.sheet .grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.sheet .grid .gcell{border:1px solid var(--paper-ink);border-radius:6px;padding:5px 0;text-align:center;font-family:var(--mono);font-size:12px;position:relative}
.sheet .grid .gcell mark{position:absolute;inset:3px;border-radius:50%;border:1.5px solid var(--paper-ink);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.sheet .grid .gcell mark.pt{background:transparent;border-style:solid}
.sheet .grid .gcell mark.ps{background:var(--paper-ink);color:var(--paper)}
.sheet .grid .gcell mark.pa{background:linear-gradient(to top,var(--paper-ink) 50%,transparent 50%)}
.sheet .grid .gcell mark.pm{background:repeating-linear-gradient(45deg,transparent 0 4px,var(--paper-ink) 4px 6px)}
.sheet .notes{margin-top:12px;font-size:12px;line-height:1.6;white-space:pre-wrap}
.sigs{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:22px}
.sigs .sg{border-top:1px dashed var(--paper-ink);padding-top:6px;font-size:11px;color:var(--paper-mut);text-align:center}
.reslink{display:flex;gap:8px;margin-top:12px}
.reslink .btn{flex:1}
.statline{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
/* ---------- history ---------- */
.histrow{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 13px;margin-top:8px}
.histrow .hmain{flex:1;min-width:0;cursor:pointer}
.histrow .hname{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.histrow .hmeta{font-size:11px;color:var(--muted);margin-top:3px;font-family:var(--mono)}
.histrow .hdel{background:transparent;border:1px solid var(--line);color:var(--faint);border-radius:8px;width:32px;height:32px;font-size:14px;cursor:pointer}
.histrow .hdel:hover{color:var(--red);border-color:var(--red)}
.empty{text-align:center;color:var(--faint);padding:44px 12px;font-size:13px;line-height:1.8}
.empty .big{font-size:34px;margin-bottom:6px}
/* history filters & report */
.filters{display:flex;flex-direction:column;gap:8px;margin:12px 0}
.frow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.frow .finput{flex:1;min-width:110px}
.frow .fselect{flex:1;min-width:110px}
.fbtn{background:var(--panel2);border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:8px 12px;font-size:12px;cursor:pointer}
.fbtn.on{background:var(--green);border-color:var(--green);color:#06110c;font-weight:700}
.fbtn:active{transform:scale(.97)}
.repstat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.repstat .rs{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px;text-align:center}
.repstat .rs b{display:block;font-family:var(--mono);font-size:18px}
.repstat .rs span{font-size:10px;color:var(--muted)}
.warnbox{border:1px solid var(--amber);background:var(--amber-soft);border-radius:10px;padding:10px 12px;margin:10px 0;font-size:12px;line-height:1.6}
.warnbox b{color:var(--amber)}
.warnbox .wrow{display:flex;align-items:center;gap:6px;margin-top:4px}
.warnbox .wrow .dot{width:6px;height:6px;border-radius:50%;background:var(--amber);display:inline-block}
.warnbox .wrow .wbtn{margin-left:auto;background:transparent;border:1px solid var(--amber);color:var(--amber);border-radius:6px;padding:2px 8px;font-size:11px;cursor:pointer}
.histrow .hmain .hscore{font-size:12px;font-weight:700;color:var(--green);font-family:var(--mono)}

.jsonwrap{background:#0a0d13;border:1px solid var(--line);border-radius:10px;padding:12px;font-family:var(--mono);font-size:11px;line-height:1.5;color:#b7c0d4;max-height:340px;overflow:auto;white-space:pre-wrap;word-break:break-all}
.formcount{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.formcount .fc{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:8px;text-align:center;font-size:10px;color:var(--muted)}
.formcount .fc b{display:block;font-size:16px;color:var(--ink);font-family:var(--mono)}
.hidden{display:none!important}
/* print */
@media print{
  body{background:#fff}
  #topbar,#bottombar,.no-print,nav,noscript{display:none!important}
  main#view{padding:0}
  #printroot{display:block!important}
  .sheet{box-shadow:none;border-radius:0}
  .sheet{font-size:12px;max-width:100%}
  .kv{grid-template-columns:1fr 1fr}
}
#printroot{display:none}
</style>
</head>
<body>
<div id="app">
  <header id="topbar"></header>
  <main id="view"></main>
</div>
<div id="bottombar" class="hidden"><div class="inner" id="bbinner"></div></div>
<div class="toast" id="toast"></div>
<div id="printroot"></div>
<noscript><div style="max-width:640px;margin:40px auto;padding:20px;color:#e9ecf3">此評分工具需要啟用 JavaScript 才能運作。</div></noscript>
<script>
"use strict";
/* ════════════════════════════════════════════════════════════════
   NIST 數位評分表 — M1 原型
   表單引擎（資料驅動）＋ 場次評分 ＋ 計時 ＋ 匯出
   ════════════════════════════════════════════════════════════════ */
const DEFAULT_FORMS = {
  meta:{
    title:"NIST sUAS 數位評分表單庫",
    based_on:"NIST Standard Test Methods for sUAS (2020B5) — Open/Obstructed Test Lane Forms Book",
    note:"green 對齊 pass=5 / partial=1；blue 缺口 correct=5。可透過「表單管理」匯入自訂 JSON 調整。"
  },
  bucket_spec:{ rows:["A","B","C","D"], stands:[1,2,3,4,5], count:20 },
  points:{ align_pass:5, align_partial:1, align_miss:0, gap_correct:5, gap_wrong:0 },
  forms:[
    {id:"open-position", lane:"open", level:"1-3", name:"Position", title:"Open Lane · Position 定位", time_limit_minutes:10, desc:"起降平台出發，與各指定 bucket 依序對齊"},
    {id:"open-traverse", lane:"open", level:"1-3", name:"Traverse", title:"Open Lane · Traverse 穿越", time_limit_minutes:10, desc:"前 3 stand 繞行 2 圈，外側 bucket 依序對齊"},
    {id:"open-orbit", lane:"open", level:"1-3", name:"Orbit", title:"Open Lane · Orbit 環繞", time_limit_minutes:10, desc:"由 orbit 中心等半徑 S 與高度 S 環繞，4 個外側 bucket 對齊"},
    {id:"open-spiral", lane:"open", level:"1-3", name:"Spiral", title:"Open Lane · Spiral 螺旋", time_limit_minutes:10, desc:"自由飛行，依指定順序對齊每根 stand 的全部 bucket"},
    {id:"open-recon", lane:"open", level:"1-3", name:"Recon", title:"Open Lane · Recon 偵察", time_limit_minutes:10, desc:"對齊兩端 landing 與 bucket，低空偵察指定目標"},

function scenarioItems(f){

    const rows=["A","B","C","D"];const labels=["ROOFTOP ANGLED BUCKET","EXTERIOR FEATURE","UNDERBODY BUCKET","INTERIOR FEATURE","INTERIOR FEATURE"];
    for(const r of rows){for(let k=1;k<=5;k++){items.push({idx:items.length,code:r+k,lbl:r+" "+k+" — "+labels[k-1]})}}

function loadSupabaseLib(){

  for(const s of sessions){
    const row={local_id:s.id,form_id:s.formId,proctor_id:au.id,candidate:s.trial.candidate,aircraft_make:s.trial.aircraft_make,aircraft_model:s.trial.aircraft_model,payload:s.trial.payload,personnel:s.trial.personnel,facility:s.trial.facility,trial_date:s.trial.date,trial_time:s.trial.time,lane_no:s.trial.lane_no,lane_spacing:s.trial.lane_spacing,lighting:s.trial.lighting,wind_avg:s.trial.wind_avg,wind_gust:s.trial.wind_gust,pilot_view:s.trial.pilot_view,time_limit_min:s.trial.time_limit_min,time_elapsed_ms:elapsedMs(s),scoring_source:s.trial.scoring_source,status:s.status,fault_code:s.fault||"",notes:s.notes||"",scores:s.scores||{}};

      scores:r.scores||{},fault:r.fault_code||"",notes:r.notes||"",timer:{startedAt:null,accum:r.time_elapsed_ms||0,running:false},status:r.status||"draft",createdAt:Date.parse(r.created_at)||Date.now(),savedAt:Date.now()};

function newSession(formId,trial,forceId){
  const f=getForm(formId);if(!f)return null;
  const t=trial||{};
  const s={id:forceId||uid(),formId,form:{id:f.id,lane:f.lane,level:f.level,name:f.name,title:f.title,time_limit_minutes:f.time_limit_minutes},
    _kind:f.kind||"bucket",_items:formItems(f.id)||[],
    trial:{
      candidate:t.candidate||"",aircraft_make:t.aircraft_make||"",aircraft_model:t.aircraft_model||"",payload:t.payload||"",
      personnel:t.personnel||"",facility:t.facility||"",date:t.date||nowISO(),time:t.time||nowTime(),lane_no:t.lane_no||"",
      lane_spacing:t.lane_spacing||"10",wind_avg:t.wind_avg||"",wind_gust:t.wind_gust||"",
      lighting:t.lighting||"DAYLIGHT",pilot_view:t.pilot_view||"EYES ON",time_limit_min:t.time_limit_min||f.time_limit_minutes||10,
      scoring_source:t.scoring_source||"Pilot"
    },
    scores:(t.scores)||{},fault:t.fault||"",notes:t.notes||"",
    timer:{startedAt:t._autoStart?Date.now():null,accum:0,running:!!t._autoStart},
    status:t.status||(t._autoStart?"draft":"draft"),createdAt:Date.now(),savedAt:Date.now()};

function elapsedMs(s){const tm=s.timer;return (tm.accum||0)+(tm.running&&tm.startedAt?Date.now()-tm.startedAt:0)}
function scoreOf(s){
  const pt=pointsFor(),items=(s._items&&s._items.length)?s._items:bucketItems();let align=0,gap=0,alignMax=items.length*pt.align_pass,gapMax=items.length*pt.gap_correct;
  for(const it of items){const v=s.scores&&s.scores[it.code];if(v==="pass")align+=pt.align_pass;else if(v==="partial")align+=pt.align_partial;else if(v==="miss")align+=0;
    const g=gapFor(it.code,s.formId);if(g&&s.scores&&s.scores[g]==="ok")gap+=pt.gap_correct;}
  return {align,gap,total:align+gap,alignMax,gapMax,totalMax:alignMax+gapMax};
}
function verdictOf(s,sc){
  const rule=(effForms().meta&&effForms().meta.passing)||null;
  const exceeded = (s.trial.time_limit_min||0)>0 && elapsedMs(s) > (s.trial.time_limit_min*60000);
  let verdict,reason;
  if(rule&&rule.min_score){
    const ok = !s.fault && sc.total>=rule.min_score && (!rule.time_limit_fail || !exceeded);
    verdict=ok?"通過":"未通過";
    reason="門檻 ≥"+rule.min_score+" 分"+(rule.time_limit_fail?" · 時限內":"");
    if(s.fault)reason+=" · "+s.fault;
    if(exceeded)reason+=" · 逾時";
  } else if(s.fault){ verdict="未通過"; reason=s.fault; }
  else { verdict="通過"; reason="依單位門檻"; }
  return {verdict,reason,rule:!!(rule&&rule.min_score)};
}

  $("#f-fault").value=s.fault||"";$("#f-notes").value=s.notes||"";

    if(handlers==="align"){if(v==="pass")cls="pass";else if(v==="partial")cls="partial";else if(v==="miss")cls="miss"}else{if(v==="ok")cls="ok";else if(v==="no")cls="no"}

  }

function cycleCode(id,code,states){
  let s=getSession(id);if(!s||s.status==="done")return;
  const cur=s.scores&&s.scores[code];const idx=states.indexOf(cur);
  const next=idx>=0?states[(idx+1)%states.length]:states[0];
  s.scores=s.scores||{};
  if(next===states[0]&&idx===states.length-1)delete s.scores[code];else if(next===states[0]&&idx===-1){}else s.scores[code]=next;
  if(!s.scores[code]||s.scores[code]===states[0])delete s.scores[code];
  s.savedAt=Date.now();saveSession(s);
  const el=document.querySelector(`#g-align [data-code="${code}"],#g-gap [data-code="${code}"]`);
  if(el)updateCell(id,el,code,states);
  buzz(12);
  if(states[0]==="pass"&&(next==="pass"||next==="partial"))linkGap(id,code);
  renderTotal(s);
}
function updateCell(id,el,code,handlers){
  const s=getSession(id);const v=s&&s.scores?s.scores[code]:undefined;
  el.className="cell";
  if(handlers[0]==="pass"){if(v==="pass")el.classList.add("pass");else if(v==="partial")el.classList.add("partial");else if(v==="miss")el.classList.add("miss")}
  else{if(v==="ok")el.classList.add("ok");else if(v==="no")el.classList.add("no")}
  el.setAttribute("data-code",code);
}
/* ---------- M3 UX: haptics + long-press undo + linked gap ---------- */
function buzz(ms){
  try{if(navigator.vibrate&&typeof navigator.vibrate==="function")navigator.vibrate(ms||15)}catch(e){}
}
function linkGap(id,code){
  const s=getSession(id);if(!s||s.status==="done")return;
  const g="G"+code;const cur=s.scores&&s.scores[g];
  const next=cur==="ok"?"no":"ok";
  s.scores=s.scores||{};
  if(next==="no")delete s.scores[g];else s.scores[g]=next;
  s.savedAt=Date.now();saveSession(s);
  const el=document.querySelector(`#g-gap [data-code="${g}"]`);
  if(el){updateCell(id,el,g,["ok","no"]);el.classList.add("linked");setTimeout(()=>el.classList.remove("linked"),500)}
}
function bindCellUX(id,el){
  let lpTimer=null,lpFired=false,startX=0,startY=0,dx=0,dy=0;
  const clear=()=>{if(lpTimer){clearTimeout(lpTimer);lpTimer=null}el.classList.remove("lp")};
  const fire=()=>{lpFired=true;buzz(35);el.classList.add("lp");clear()};
  el.addEventListener("touchstart",e=>{
    const t=e.touches[0];startX=t.clientX;startY=t.clientY;dx=0;dy=0;lpFired=false;
    lpTimer=setTimeout(fire,430);
  },{passive:true});
  el.addEventListener("touchmove",e=>{
    const t=e.touches[0];dx=Math.abs(t.clientX-startX);dy=Math.abs(t.clientY-startY);
    if(dx>10||dy>10)clear();
  },{passive:true});
  el.addEventListener("touchend",e=>{
    clear();
    if(lpFired){e.preventDefault();e.stopPropagation();const code=el.dataset.code;const kind=el.dataset.kind;
      const s=getSession(id);if(s&&s.scores&&s.scores[code]){delete s.scores[code];s.savedAt=Date.now();saveSession(s);updateCell(id,el,code,kind==="gap"?["ok","no"]:["pass","partial","miss"]);renderTotal(s);toast("已復原 "+code)}
      return}
    if(dx<10&&dy<10){buzz(12);el.click()}
  },{passive:false});
  el.addEventListener("mousedown",()=>{lpTimer=setTimeout(fire,430)});
  el.addEventListener("mousemove",()=>{if(dx>10||dy>10)clear()});
  el.addEventListener("mouseup",()=>{clear();if(lpFired){const code=el.dataset.code;const kind=el.dataset.kind;const s=getSession(id);if(s&&s.scores&&s.scores[code]){delete s.scores[code];s.savedAt=Date.now();saveSession(s);updateCell(id,el,code,kind==="gap"?["ok","no"]:["pass","partial","miss"]);renderTotal(s);toast("已復原 "+code)}}});
  el.addEventListener("mouseleave",clear);
}
function renderTimer(s){

  el.innerHTML=`<div>
    ${s.timer.running?`<span class="chip ok">計時中</span>`:`<span class="chip">暫停</span>`}

function toggleTimer(id){

function finishSession(id){

function printSheetHTML(id){
  const s=getSession(id);if(!s)return"";
  const sc=scoreOf(s),items=bucketItems();
  const rowSet=[...new Set(items.map(i=>i.row))];
  const t=s.trial;
  const kvd=[];const kv=(k,v)=>{kvd.push(`<tr><td style="padding:2px 10px 2px 0;color:#555;font-size:11px">${k}</td><td style="padding:2px 0;font-size:11px;font-weight:600">${esc(v)||"—"}</td></tr>`)};
  kv("考生",t.candidate);kv("日期時間",t.date+" "+t.time);kv("廠牌／型號",(t.aircraft_make||"")+" "+(t.aircraft_model||""));
  kv("配置",t.payload);kv("考官",t.personnel);kv("設施",t.facility);kv("場道",(t.lane_no||"")+(t.lane_spacing?" · S="+t.lane_spacing+"m":""));
  kv("照明",t.lighting);kv("Pilot View",t.pilot_view);kv("風（均/陣）",(t.wind_avg||"")+" / "+(t.wind_gust||"")+" km/h");
  kv("時限",t.time_limit_min+" min");kv("用時",fmtElapsed(elapsedMs(s)));kv("評分",t.scoring_source);
  const cpr=(code,kind)=>{const v=s.scores&&s.scores[code];let mk="pt";
    if(kind==="a"){if(v==="pass")mk="ps";else if(v==="partial")mk="pa";else if(v==="miss")mk="pm"}else{if(v==="ok")mk="ps";else if(v==="no")mk="pm"}
    return `<span style="display:inline-flex;width:30px;height:30px;border:1.4px solid #222;border-radius:50%;margin:3px;align-items:center;justify-content:center;position:relative">
      <span style="position:absolute;inset:6px;border-radius:50%;${mk==="ps"?"background:#222":mk==="pa"?"background:linear-gradient(to top,#222 50%,transparent 50%)":mk==="pm"?"background:repeating-linear-gradient(45deg,transparent 0 3px,#222 3px 5px)":""}"></span></span>`};
  let ag="",gg="";
  rowSet.forEach(r=>{const ri=items.filter(i=>i.row===r);ag+=ri.map(it=>cpr(it.code,"a")).join("");gg+=ri.map(it=>cpr("G"+it.code,"g")).join("")});
  return `<div class="sheet" style="background:#fff;color:#111;padding:24px">
    <div style="font-size:18px;font-weight:800">NIST 數位評分表</div>
    <div style="font-size:10px;letter-spacing:.2em;color:#666;margin:2px 0 10px;text-transform:uppercase">${esc(LANES[s.form.lane])} · LEVEL ${esc(s.form.level)} · ${esc(s.form.name)} · 2020B5</div>
    <table style="border-collapse:collapse;margin-bottom:8px">${kvd.join("")}</table>
    <div style="font-size:11px;font-weight:700;border-bottom:1.5px solid #222;margin:8px 0 6px">對齊 ${sc.align}/${sc.alignMax} · 缺口 ${sc.gap}/${sc.gapMax} · 總分 ${sc.total}/${sc.totalMax}</div>
    <div style="font-size:12px;margin:4px 0;padding:5px 8px;border:1.5px solid #222;display:inline-block;font-weight:800">判定：${verdictOf(s,sc).verdict}（${verdictOf(s,sc).reason}）</div>
    <div>${ag}</div>
    <div style="font-size:11px;font-weight:700;border-bottom:1.5px solid #222;margin:8px 0 6px">Gap Directions（實心＝正確）</div>
    <div>${gg}</div>
    ${s.fault?`<div style="margin-top:10px;font-size:11px"><b>結束原因：</b>${esc(s.fault)}</div>`:""}
    ${s.notes?`<div style="margin-top:6px;font-size:11px"><b>備註：</b>${esc(s.notes)}</div>`:""}
    <table style="width:100%;margin-top:26px"><tr><td style="border-top:1px dashed #999;font-size:10px;color:#666;text-align:center;padding-top:4px">考官簽名</td><td style="border-top:1px dashed #999;font-size:10px;color:#666;text-align:center;padding-top:4px">考生簽名</td></tr></table>
  </div>`;
}
function printSheet(id){
  const s=getSession(id);if(!s)return;

function exportCSV(id){
  const s=getSession(id);if(!s)return;
  const sc=scoreOf(s),items=bucketItems(),t=s.trial;
  const q=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"';
  const rows=[];
  rows.push(["NIST 數位評分表 — 匯出"].join(","));
  rows.push(["場道",LANES[s.form.lane],"Level",s.form.level,"表單",s.form.name].map(q).join(","));
  rows.push(["考生",t.candidate,"日期時間",t.date+" "+t.time,"考場設施",t.facility].map(q).join(","));
  rows.push(["飛機",(t.aircraft_make||"")+" "+(t.aircraft_model||""),"配置",t.payload,"考官",t.personnel].map(q).join(","));
  rows.push(["場道編號",t.lane_no,"間距S",t.lane_spacing+"m","照明",t.lighting].map(q).join(","));
  rows.push(["平均風速",t.wind_avg+" km/h","最大陣風",t.wind_gust+" km/h","Pilot View",t.pilot_view].map(q).join(","));
  rows.push(["時限",t.time_limit_min+" min","用時",fmtElapsed(elapsedMs(s)),"評分方式",t.scoring_source].map(q).join(","));
  rows.push([]);
  rows.push(["項目","類型","結果","得分"]);
  for(const it of items){
    const v=s.scores&&s.scores[it.code];const map={pass:"對齊",partial:"部分",miss:"漏失"};const gs=map[v]||"未評";
    rows.push([it.code,"對齊",gs,v==="pass"?5:v==="partial"?1:0].join(","));
    const g=s.scores&&s.scores["G"+it.code];const gs2=g==="ok"?"正確":g==="no"?"錯誤":"未評";
    rows.push(["G"+it.code,"缺口",gs2,g==="ok"?5:0].join(","));
  }
  rows.push([]);
  rows.push(["對齊小計",sc.align+"/"+sc.alignMax,"缺口小計",sc.gap+"/"+sc.gapMax,"總分",sc.total+"/"+sc.totalMax]);
  if(s.fault)rows.push(["結束原因",s.fault]);
  if(s.notes)rows.push(["備註",s.notes]);
  const blob=new Blob(["\ufeff"+rows.join("\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);
  a.download="nist-"+s.form.id+"-"+t.date+".csv";a.click();URL.revokeObjectURL(a.href);
  toast("CSV 已匯出");
}

function vHistory(){
  const all=listSessions();
  topbar({ttl:"歷史報表",sub:"HISTORY · REPORT"});
  const lanes=["open","obstructed","confined"];
  const levels=[...new Set(all.map(x=>x.form&&x.form.level).filter(Boolean))];
  const laneFilter=lsGet("hist_lane","all");
  const levelFilter=lsGet("hist_level","all");
  const q=(lsGet("hist_q","")).toLowerCase();
  const dateFrom=lsGet("hist_from",""),dateTo=lsGet("hist_to","");
  const filtered=all.filter(x=>{
    if(laneFilter!=="all"&&x.form.lane!==laneFilter)return false;
    if(levelFilter!=="all"&&String(x.form.level)!==String(levelFilter))return false;
    if(q){const hay=(x.trial.candidate||"")+" "+(x.form.title||"")+" "+(x.trial.facility||"");if(!hay.toLowerCase().includes(q))return false}
    if(dateFrom&&x.trial.date&&x.trial.date<dateFrom)return false;
    if(dateTo&&x.trial.date&&x.trial.date>dateTo)return false;
    return true;
  });
  const done=filtered.filter(x=>x.status==="done");
  const avg=done.length?Math.round(done.reduce((a,x)=>a+scoreOf(x).total,0)/done.length):0;
  const max=done.length?Math.max(...done.map(x=>scoreOf(x).total)):0;
  const conds=(x)=>{const t=x.trial;return [t.lane_spacing?("S="+t.lane_spacing+"m"):null,t.lighting,t.pilot_view,(t.time_limit_min?t.time_limit_min+"min":null)].filter(Boolean).join(" · ")};
  const condKey=x=>JSON.stringify([x.trial.lane_spacing,x.trial.lighting,x.trial.pilot_view,x.trial.time_limit_min]);
  const warn=[];
  const grp=Object.groupBy?Object.groupBy(done,x=>condKey(x)):null;
  if(grp){for(const k of Object.keys(grp)){if(grp[k].length>1)warn.push({key:k,list:grp[k]})}}
  const rows=filtered.map(x=>{
    const sc=scoreOf(x);const t=x.trial;
    const st=x.status==="done"?'<span class="chip ok">已提交</span>':(x.timer.running?'<span class="chip">進行中</span>':'<span class="chip">草稿</span>');
    const vd=verdictOf(x,sc);
    return `<div class="histrow">
      <div class="hmain" data-goto="#/result/${x.id}">
        <div class="hname">${esc(t.candidate||"（未填考生）")} · ${esc(x.form.title)}</div>
        <div class="hmeta">${esc(t.date+" "+t.time)} · ${esc(conds(x))}</div>
        <div class="hscore">${sc.total}/${sc.totalMax} 分 · ${esc(vd.verdict)}</div>
      </div>
      ${st}
      <button class="hdel" data-del="${x.id}" aria-label="刪除">✕</button>
    </div>`;
  }).join("");
  const warnHtml=warn.length?'<div class="warnbox"><b>⚠ 條件可比性警告</b><div style="margin-top:4px">以下場次雖然「已提交」，但條件（間距／照明／Pilot View／時限）不同，官方規範成績不應互相比較：</div>'+
    warn.map(w=>`<div class="wrow"><span class="dot"></span><span>${esc(w.key)} × ${w.list.length} 筆</span><button class="wbtn" data-wkey="${esc(w.key)}">只看這組</button></div>`).join("")+'</div>':'';
  $("#view").innerHTML=`
    <div class="eyebrow">${filtered.length} 筆 / ${all.length} 總場次</div>
    <h1 class="viewttl">歷史報表</h1>
    <div class="filters">
      <div class="frow">
        <input class="finput" id="f-q" placeholder="搜尋考生／表單／設施" value="${esc(q)}">
        <input class="finput" type="date" id="f-from" value="${esc(dateFrom)}"><span style="color:var(--faint);font-size:11px">至</span>
        <input class="finput" type="date" id="f-to" value="${esc(dateTo)}">
      </div>
      <div class="frow">
        <select class="fselect" id="f-lane">${["all","open","obstructed","confined"].map(l=>`<option value="${l}" ${laneFilter===l?"selected":""}>${l==="all"?"全部場道":LANES[l]}</option>`).join("")}</select>
        <select class="fselect" id="f-level">${["all",...levels].map(l=>`<option value="${l}" ${String(levelFilter)===String(l)?"selected":""}>${l==="all"?"全部 Level":"Level "+l}</option>`).join("")}</select>
        <button class="fbtn" id="f-reset">重設</button>
      </div>
    </div>
    <div class="repstat">
      <div class="rs"><b>${done.length}</b><span>已提交</span></div>
      <div class="rs"><b>${avg}</b><span>平均分</span></div>
      <div class="rs"><b>${max}</b><span>最高分</span></div>
    </div>
    ${warnHtml}
    ${filtered.length?rows:'<div class="empty"><div class="big">◎</div>沒有符合條件的場次。</div>'}
    <div class="btnrow" style="margin-top:14px">
      <button class="btn ghost block" id="f-export">匯出報表 CSV</button>
    </div>`;
  const bind=()=>{
    const el=id=>document.getElementById(id);
    el("f-q").addEventListener("input",e=>{lsSet("hist_q",e.target.value);vHistory()});
    el("f-from").addEventListener("change",e=>{lsSet("hist_from",e.target.value);vHistory()});
    el("f-to").addEventListener("change",e=>{lsSet("hist_to",e.target.value);vHistory()});
    el("f-lane").addEventListener("change",e=>{lsSet("hist_lane",e.target.value);vHistory()});
    el("f-level").addEventListener("change",e=>{lsSet("hist_level",e.target.value);vHistory()});
    el("f-reset").onclick=()=>{["hist_q","hist_from","hist_to","hist_lane","hist_level"].forEach(k=>localStorage.removeItem(k));vHistory()};
    el("f-export").onclick=()=>exportReport(filtered);
    document.querySelectorAll("[data-goto]").forEach(el=>el.addEventListener("click",()=>location.hash=el.dataset.goto));
    document.querySelectorAll(".hdel").forEach(el=>el.addEventListener("click",()=>{if(confirm("確定刪除這場次紀錄？")){delSession(el.dataset.del);toast("已刪除");vHistory()}}));
    document.querySelectorAll(".wbtn").forEach(el=>el.addEventListener("click",()=>{lsSet("hist_q","");lsSet("hist_lane","all");lsSet("hist_level","all");lsSet("hist_from","");lsSet("hist_to","");vHistory()}));
  };
  bind();
}
function exportReport(rows){
  const q=v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"';
  const out=["考生,表單,場道,Level,日期,時間,間距,照明,Pilot View,時限,用時,對齊,缺口,總分,判定,結束原因"];
  for(const x of rows){const sc=scoreOf(x),t=x.trial,vd=verdictOf(x,sc);
    out.push([t.candidate,x.form.title,x.form.lane,x.form.level,t.date,t.time,t.lane_spacing,t.lighting,t.pilot_view,t.time_limit_min,fmtElapsed(elapsedMs(x)),sc.align,sc.gap,sc.total,vd.verdict,x.fault||""].map(q).join(","));}
  const blob=new Blob(["\ufeff"+out.join("\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="nist-report-"+nowISO()+".csv";a.click();URL.revokeObjectURL(a.href);
  toast("報表已匯出");
}

  const f=getForm("open-position");if(!f)return null;
  if(!demo){
    demo=newSession("open-position",{candidate:"示範考生 D-001",aircraft_make:"DJI",aircraft_model:"Mavic 3E",payload:"RTK + 1x zoom",
      personnel:"考官範例",facility:"示範測試場",date:nowISO(),time:nowTime(),lane_no:"Lane 1",lane_spacing:"10",wind_avg:"8",wind_gust:"14",
      lighting:"DAYLIGHT",pilot_view:"EYES ON",time_limit_min:10,scoring_source:"Pilot",_autoStart:true},"demo");
  }
  if(!demo.scores||!Object.keys(demo.scores).length)seedDemoScores(demo);
  if(finished){
    if(demo.timer.running){demo.timer.accum+=Date.now()-demo.timer.startedAt;demo.timer.startedAt=null;demo.timer.running=false}
    demo.status="done";demo.finishedAt=Date.now();
  }
  demo.savedAt=Date.now();saveSession(demo);
  return demo;
}
function bootDemo(){const d=ensureDemoSession(false);if(!d)return;location.hash="#/score/demo";vScore(d.id)}
function bootResultDemo(){const d=ensureDemoSession(true);if(!d)return;location.hash="#/result/demo";vResult(d.id)}
function gotoPage(h){location.hash=h}
document.addEventListener("click",e=>{
  const g=e.target.closest("[data-goto]");
  if(g){e.preventDefault();if(g.dataset.goto==="#/demo"){bootDemo()}else{location.hash=g.dataset.goto;return}}
});
route();
initAuth();
</script>
